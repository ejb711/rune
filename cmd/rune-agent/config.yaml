extensions:
  rune-agent:
    path: '$RUNE_DATADIR/bin/rune-agent'
    config:
      # Provider API keys, custom OpenAI-compatible endpoints, codex login
      # state, and local model registries now live host-side under the
      # top-level `models.*` block in the rune config (managed via the
      # `models providers` and `models local` rune shell commands).
      # Name of the project instructions file to discover. The agent
      # walks up from the workspace root looking for files with this
      # name and injects their contents into the system prompt.
      agents_file: AGENTS.md
      # Commit attribution text. {{provider}} and {{model}} expand to the
      # resolved model. Set commit to an empty string to disable attribution.
      attribution:
        commit: 'Co-Authored-By: Rune Agent ({{provider}}/{{model}}) <agent@rune.build>'
      # The chat (`agent`), query (`?`), compaction, and memory
      # consolidation models are host-side aliases named `default`,
      # `query`, `compact`, and `dream`. An unset alias falls back to
      # `default`, which itself resolves to the latest authenticated
      # provider's flagship model. Point any of them at a specific model
      # with the `models alias` rune shell command.
      skills:
        - .rune/skills
        - ~/.rune/skills
        - .agents/skills
        - ~/.agents/skills
      background_attr:
        bg: default
      user_msg_attr:
        fg: default
        bg: default
        flags: dim
      user_msg_background_attr:
        bg: gray
      assistant_msg_attr:
        fg: default
        bg: default
        flags: italic
      input_box_attr:
        fg: default
        bg: default
      input_box_placeholder_attr:
        fg: red
        bg: default
      input_box_frame_attr:
        fg: default
        bg: default
      context_hint_attr:
        fg: red
      # Styling for the '#' context completion overlay. Defaults mirror
      # the command prompt (see "command.*_attr" in rune.star) so both
      # search overlays look consistent.
      completion_matched_text_attr:
        fg: blue
        bg: default
        flags: bold
      completion_focus_element_attr:
        fg: purple
        bg: default
      completion_element_attr:
        fg: default
        bg: default
        flags: dim
      # Sweep color of the radar-frame shader drawn over the compose box
      # while completion candidates stream in. Neutral by default so it
      # reads the same under every theme.
      completion_radar_color: dimgray
      # Accepted '#' completions remain readable in the sentence while
      # their attachment chips stay visible above the composer.
      inline_attachment_attr:
        fg: aqua
        bg: default
        flags: underline
      # When the modal (vi-style) composer opens, enter insert mode so
      # the first keystroke types instead of requiring `i`. Set to false
      # to keep the composer in normal mode at startup. Only affects the
      # modal composer; modeless is unchanged.
      editor_modal_start_insert: true
      # How many lines of surrounding code `chatreviewchanges` shows
      # around each hunk. Patches carry very little context of their
      # own, so the review reads the rest from the file as it stands
      # now. Set to 0 to show only the lines the agent changed.
      review_context_lines: 3
